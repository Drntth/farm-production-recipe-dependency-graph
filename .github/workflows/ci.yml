name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      # the map editor tests run its JS core with node
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: ruff check src tests
      - run: ruff format --check src tests

  # the static site on a few levels: type check, build, Playwright (mobile + desktop)
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r ../requirements.txt
      - run: python -m src recommend --levels 1,20,40
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
